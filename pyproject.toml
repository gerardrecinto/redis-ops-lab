[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redis-ops-lab"
version = "0.1.0"
description = "Redis operations portfolio project: primary/replica/Sentinel deployment with real automated failover, cache-aside invalidation, rate limiting, distributed locking with fencing tokens, and eviction-policy verification."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["redis_ops_lab*"]
